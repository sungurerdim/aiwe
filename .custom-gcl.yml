# Builds custom-gcl: golangci-lint with the nilaway module plugin (SPEC §5.17, §12.2).
# Build: go tool -modfile=tools/go.mod golangci-lint custom. version must equal the
# golangci-lint version in tools/go.mod.
version: v2.14.0
name: custom-gcl
destination: .
plugins:
  - module: go.uber.org/nilaway
    import: go.uber.org/nilaway/cmd/gclplugin
    version: v0.0.0-20260918162853-acb8859b9031
